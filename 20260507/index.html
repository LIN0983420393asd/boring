<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="contents">
        <form action="non" action="#" method="post">
            <img class="css-wtk2jz element.style " src="leave_request_form_1.jpg" alt="請假單">
            <h1 class="topic">請假申請單</h1>
            <p><strong>❗快來使用此範本，可以編輯這份範本的所有內容、圖片</strong></p>
            <p>有請假需求的同仁，請填寫此份申請表</p>
            <div class="size">1 申請人姓名</div>
            <input class="textfield" type="text" placeholder="請輸入名字">
            <div class="size ">2 所屬單位</div>
            <select class="box" name="select" required>
                <option value="" disabled selected>請選擇</option>
                <option value="0">行銷部門</option>
                <option value="1">業務部門</option>
                <option value="2">財務部門</option>
                <option value="3">人資部門</option>
                <option value="4">研發部門</option>
                <option value="5">運營部門</option>
                <option value="6">客服部門</option>
                <option value="7">品管部門</option>
                <option value="8">IT 部門</option>
                <option value="9">公關部門</option>
            </select>
            <P></P>
            <div class="background">
                <img src="testimonial_quotes_icon_153989.png" alt="" width="100">
                <p>請假須知</p>
                <p>請注意：</p>
                <p>- 超過五天的假，請提前通知您的主管、職務代理人，以便組織進行必要的調整。</p>
                <p>- 如果您參與的項目或工作需要臨時替代，請提供相關的指導或建議。</p>
            </div>
            <div>4 假別</div>
            <div class="dd"><input type="radio" name="leave" id="special vacation" value="特休假">
                <label for="special vacation">特休假</label>
            </div>
            <div class="dd"><input type="radio" name="leave" id="sick leave" value="病假">
                <label for="sick leave">病假</label>
            </div>
            <div class="dd"><input type="radio" name="leave" id="personal leave" value="事假">
                <label for="personal leave">事假</label>
            </div>
            <div class="size">5 事假的開始日期</div>
            <input class="textfield" type="date" >

            <div class="size">6 事假的結束日期</div>
            <input class="textfield" type="date">
            <div class="size">7 請假事由</div>
            <div class="dd"><input type="radio" name="leave" id="personal vacation" value="個人假期">
                <label for="personal vacation">個人假期</label>
            </div>
            <div class="dd"><input type="radio" name="leave" id="Family" value="家庭緊急是由">
                <label for="Family">家庭緊急是由</label>
            </div>
            <div class="dd"><input type="radio" name="leave" id="healthy" value="健康問題">
                <label for="healthy">健康問題</label>
            </div>
            <div class="dd"><input type="radio" name="leave" id="other" value="其他">
                <label for="other">其他</label>
                <input class="textfield" type="text" name="" id="" placeholder="請填入文字">
            </div>
            <div class="size">8 職務代理人 </div>
            <input class="textfield" type="text" placeholder="請輸入文字">
            <div class="css-jjmfp5">
                <input class="textfield mm" type="submit" value="送出">
            </div>
        </form>
    </main>
</body>

</html>
